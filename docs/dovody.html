<section class="section wrap" style="padding-bottom:1.5rem">
  <h1>Доводы</h1>
  <p class="prose" style="margin-top:1rem">Восемнадцать штук. Отмечай те, с которыми согласен: выбор сохраняется и переезжает с тобой на другие страницы сайта.</p>
</section>

<div class="tally">
  <div class="wrap tally-in">
    <span class="tally-n" data-tally-n>0</span>
    <span class="tally-t" data-tally-text>пока ни одного, начни сверху</span>
    <span class="tally-bar"><span class="tally-fill" data-tally-fill></span></span>
  </div>
</div>

<section class="section wrap" style="padding-top:1.5rem">
  <ul class="args"><li><button class="arg" type="button" aria-pressed="false" data-id="a1"><span class="arg-n">01</span><span class="arg-box"><svg class="ico" aria-hidden="true"><use href="#i-check"></use></svg></span><span class="arg-t">Билет стоит четыреста пятьдесят</span><span class="arg-d">И не дорожает, пока ты думаешь. Авиабилет за это же время сменил тариф дважды.</span></button></li><li><button class="arg" type="button" aria-pressed="false" data-id="a2"><span class="arg-n">02</span><span class="arg-box"><svg class="ico" aria-hidden="true"><use href="#i-check"></use></svg></span><span class="arg-t">Место в зале уже держат</span><span class="arg-d">Восьмой ряд, у прохода, чтобы ноги вытянуть. В отеле за тобой никто ничего не держит.</span></button></li><li><button class="arg" type="button" aria-pressed="false" data-id="a3"><span class="arg-n">03</span><span class="arg-box"><svg class="ico" aria-hidden="true"><use href="#i-check"></use></svg></span><span class="arg-t">Проверь срок загранника</span><span class="arg-d">Прямо сейчас, не откладывая. Мы подождём. Ладно, не подождём.</span></button></li><li><button class="arg" type="button" aria-pressed="false" data-id="a4"><span class="arg-n">04</span><span class="arg-box"><svg class="ico" aria-hidden="true"><use href="#i-check"></use></svg></span><span class="arg-t">Подъём в четыре утра в аэропорт</span><span class="arg-d">У нас в четыре утра тоже кое-что происходит. Но это начало сеанса, а не будильник.</span></button></li><li><button class="arg" type="button" aria-pressed="false" data-id="a5"><span class="arg-n">05</span><span class="arg-box"><svg class="ico" aria-hidden="true"><use href="#i-check"></use></svg></span><span class="arg-t">Сеанс идёт полтора часа</span><span class="arg-d">Перелёт идёт четыре, и это только в одну сторону, и там не показывают ничего.</span></button></li><li><button class="arg" type="button" aria-pressed="false" data-id="a6"><span class="arg-n">06</span><span class="arg-box"><svg class="ico" aria-hidden="true"><use href="#i-check"></use></svg></span><span class="arg-t">В зале темно</span><span class="arg-d">Дресс-код соблюдён заранее, ровно тот же, что на фотографии. Проверок на входе не будет.</span></button></li><li><button class="arg" type="button" aria-pressed="false" data-id="a7"><span class="arg-n">07</span><span class="arg-box"><svg class="ico" aria-hidden="true"><use href="#i-check"></use></svg></span><span class="arg-t">«Всё включено» включает не то</span><span class="arg-d">Включено вообще всё, кроме людей, с которыми это имеет хоть какой-то смысл.</span></button></li><li><button class="arg" type="button" aria-pressed="false" data-id="a8"><span class="arg-n">08</span><span class="arg-box"><svg class="ico" aria-hidden="true"><use href="#i-check"></use></svg></span><span class="arg-t">Шезлонг займут в шесть двадцать</span><span class="arg-d">Полотенцем. Немецким. И ты ничего не сделаешь.</span></button></li><li><button class="arg" type="button" aria-pressed="false" data-id="a9"><span class="arg-n">09</span><span class="arg-box"><svg class="ico" aria-hidden="true"><use href="#i-check"></use></svg></span><span class="arg-t">Море никуда не денется</span><span class="arg-d">Оно будет там и в следующем году, и через пять лет. Этот конкретный сеанс не будет.</span></button></li><li><button class="arg" type="button" aria-pressed="false" data-id="a10"><span class="arg-n">10</span><span class="arg-box"><svg class="ico" aria-hidden="true"><use href="#i-check"></use></svg></span><span class="arg-t">После титров начнётся спор</span><span class="arg-d">О финале, о том, кто что понял, и почему все не правы кроме тебя. Спор переезжает к мангалу.</span></button></li><li><button class="arg" type="button" aria-pressed="false" data-id="a11"><span class="arg-n">11</span><span class="arg-box"><svg class="ico" aria-hidden="true"><use href="#i-check"></use></svg></span><span class="arg-t">Никакого роуминга</span><span class="arg-d">Тебе не придётся ловить вайфай у ресепшена, чтобы прочитать сообщение из дома.</span></button></li><li><button class="arg" type="button" aria-pressed="false" data-id="a12"><span class="arg-n">12</span><span class="arg-box"><svg class="ico" aria-hidden="true"><use href="#i-check"></use></svg></span><span class="arg-t">К тебе не подойдут четырнадцать раз</span><span class="arg-d">Ни с кальяном, ни с фотоаппаратом, ни с массажем, ни с экскурсией на яхте.</span></button></li><li><button class="arg" type="button" aria-pressed="false" data-id="a13"><span class="arg-n">13</span><span class="arg-box"><svg class="ico" aria-hidden="true"><use href="#i-check"></use></svg></span><span class="arg-t">Не надо собирать чемодан</span><span class="arg-d">И не надо потом две недели решать, разбирать его сегодня или уже завтра.</span></button></li><li><button class="arg" type="button" aria-pressed="false" data-id="a14"><span class="arg-n">14</span><span class="arg-box"><svg class="ico" aria-hidden="true"><use href="#i-check"></use></svg></span><span class="arg-t">Возвращаться некуда</span><span class="arg-d">В хорошем смысле: ты уже дома. Вечер заканчивается не самолётом, а такси.</span></button></li><li><button class="arg" type="button" aria-pressed="false" data-id="a15"><span class="arg-n">15</span><span class="arg-box"><svg class="ico" aria-hidden="true"><use href="#i-check"></use></svg></span><span class="arg-t">Курс валют</span><span class="arg-d">Тут он ровно один к одному и не меняется по дороге к кассе.</span></button></li><li><button class="arg" type="button" aria-pressed="false" data-id="a16"><span class="arg-n">16</span><span class="arg-box"><svg class="ico" aria-hidden="true"><use href="#i-check"></use></svg></span><span class="arg-t">Тебя зовут по имени</span><span class="arg-d">А не «номер четыреста двенадцать». И помнят, что ты пил в прошлый раз.</span></button></li><li><button class="arg" type="button" aria-pressed="false" data-id="a17"><span class="arg-n">17</span><span class="arg-box"><svg class="ico" aria-hidden="true"><use href="#i-check"></use></svg></span><span class="arg-t">Никто не спросит, как ты отдохнул</span><span class="arg-d">Потому что все были рядом и всё видели своими глазами. Причём одновременно с тобой.</span></button></li><li><button class="arg" type="button" aria-pressed="false" data-id="a18"><span class="arg-n">18</span><span class="arg-box"><svg class="ico" aria-hidden="true"><use href="#i-check"></use></svg></span><span class="arg-t">Ты уже открыл этот сайт</span><span class="arg-d">Люди, которые твёрдо летят в Турцию, такие сайты не открывают и точно не долистывают до восемнадцатого пункта.</span></button></li></ul>
